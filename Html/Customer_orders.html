<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliciano — My Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../CSS/Customer_orders.css"/>
  <link rel="stylesheet" href="../CSS/responsive.css">
</head>
<body>

  <div class="dashboard">

    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">Feliciano</div>
      <div class="top-right">
        <div class="dashboard-label">Customer<br>Dashboard</div>
        <div class="logout" onclick="window.location.href='login.html'">
          <img src="../Images/logout.png" alt="Logout" class="logout-icon">
         </div>
      </div>
    </header>

    <!-- Outer glass wrapper -->
    <div class="outer-wrapper">

      <!-- Navbar -->
      <nav class="navbar">
        <a href="Customer.html" class="nav-item">
          <i class="fas fa-utensils"></i> Menu Items
        </a>
        <a href="Customer_table.html" class="nav-item">
          <i class="far fa-calendar-alt"></i> Booking
        </a>
        <a href="Customer_orders.html" class="nav-item active">
          <i class="fas fa-shopping-cart"></i> Order List
        </a>
        <a href="Customer_profile.html" class="nav-item">
          <i class="far fa-user-circle"></i> Profile
        </a>
      </nav>

      <!-- Main Content -->
      <main class="main-content">

        <h1 class="page-title">My Orders</h1>
        <p class="page-subtitle">Track your orders and download bills</p>
        <h2 class="section-title">Active Orders (2)</h2>

        <div class="orders-list">
          <p style="text-align: center; color: rgba(255, 255, 255, 0.6); margin-top: 20px;">Loading your orders...</p>
        </div>
      </main>

    </div>
  </div>

  <script src="../JavaScript/customer_orders.js"></script>
</body>
</html>
